name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Lint
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Build GitHub Pages
        run: pnpm build:pages

      - name: Upload packages artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/
          retention-days: 1

      - name: Upload pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages/

  deploy-pages:
    name: Deploy GitHub Pages
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish to npm
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          HUSKY: 0

      - name: Download packages artifact
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages/

      - name: Get package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if umbrella version already published
        id: check
        run: |
          if npm view cos-design@"${{ steps.version.outputs.version }}" version 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "cos-design@${{ steps.version.outputs.version }} already exists on npm — skip publish (no selective release in this commit)."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "cos-design@${{ steps.version.outputs.version }} not on npm — will publish changed packages only."
          fi

      - name: Configure npm auth
        if: steps.check.outputs.published == 'false'
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is empty. Set it in repo Settings → Secrets → Actions."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          echo "registry=https://registry.npmjs.org/" >> .npmrc
          echo "always-auth=true" >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish changed packages to npm
        if: steps.check.outputs.published == 'false'
        run: node scripts/publish-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Tag release
        if: steps.check.outputs.published == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skip."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
            echo "Created tag $TAG"
          fi
