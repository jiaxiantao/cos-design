name: Refresh Context7 Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'public/llms.txt'
      - 'public/llms-full.txt'
      - 'README.md'
      - 'AGENTS.md'
      - 'QUICKSTART.md'
      - 'context7.json'
      - '.cursor/skills/cos-design/**'
      - 'website-content/**'
      - 'src/pages/config/components.ts'

jobs:
  refresh:
    name: Refresh Context7
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::warning::CONTEXT7_API_KEY secret not set — Context7 index will go stale. Add it from https://context7.com/dashboard then re-run this workflow."
            echo "Library is already listed as /jiaxiantao/cos-design; refresh still needs the API key."
            exit 0
          fi
          echo "Refreshing /jiaxiantao/cos-design …"
          curl -sS -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d '{"libraryName": "/jiaxiantao/cos-design"}'
          echo
          echo "After refresh settles, run locally: pnpm verify:context7"
