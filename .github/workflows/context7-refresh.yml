name: Refresh Context7 Docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'public/llms.txt'
      - 'public/llms-full.txt'
      - 'README.md'
      - 'AGENTS.md'
      - 'QUICKSTART.md'
      - 'context7.json'
      - '.cursor/skills/cos-design/**'
      - 'website-content/**'
      - 'src/pages/config/components.ts'

jobs:
  refresh:
    name: Refresh Context7
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "CONTEXT7_API_KEY secret not set — skip refresh."
            echo "Add the secret after submitting the library at https://context7.com/add-library"
            exit 0
          fi
          curl -sS -X POST https://context7.com/api/v1/refresh \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d '{"libraryName": "/jiaxiantao/cos-design"}'
          echo
